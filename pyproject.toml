[project]
name = "velora"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-axes[ipware]>=8.3.1",
    "django-environ>=0.14.0",
    "django-simple-history>=3.13.0",
    "django-stubs-ext>=6.1.2",
    "gunicorn>=26.2.0",
    "psycopg[binary]>=3.3.6",
    "whitenoise[brotli]>=6.12.0",
]

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "mypy>=2.4.0",
    "prek>=0.5.5",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.16.10",
]

[tool.ruff]
target-version = "py314"
line-length = 88
extend-exclude = ["**/migrations/*"]

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    # Conflict with ruff format.
    "COM812",
    "ISC001",
    # No license header policy for this project.
    "CPY001",
    # Package, magic-method, Meta and __init__ docstrings add noise in Django.
    "D104",
    "D105",
    "D106",
    "D107",
    # Django's Meta/admin/form class attributes are idiomatically mutable lists.
    "RUF012",
    # Overlaps with EM; forcing a custom exception class per message is overkill.
    "TRY003",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["D1", "S101", "S105", "PLR2004", "ARG", "ANN", "PT009", "PT027"]
"**/test_*.py" = ["D1", "S101", "S105", "PLR2004", "ARG", "ANN", "PT009", "PT027"]
"conftest.py" = ["D1", "S101", "S105", "PLR2004", "ARG", "INP001"]
"manage.py" = ["D1", "INP001"]
"apps/*/admin.py" = ["D1"]
"apps/*/apps.py" = ["D1"]
"apps/*/urls.py" = ["D1"]
"apps/*/*_urls.py" = ["D1"]
# Gunicorn config, not a package; /dev/shm is its documented heartbeat dir.
"docker/gunicorn.conf.py" = ["INP001", "S108"]

[tool.ruff.lint.pydocstyle]
convention = "google"
ignore-decorators = ["django.dispatch.receiver", "typing.override"]
property-decorators = ["django.utils.functional.cached_property"]

[tool.ruff.lint.mccabe]
max-complexity = 8

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 10
max-returns = 4
max-statements = 40

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.lint.flake8-self]
# Model._meta is Django's documented public API.
extend-ignore-names = ["_meta"]

[tool.ruff.lint.isort]
combine-as-imports = true

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = ["--strict-markers", "--strict-config", "--cov"]
xfail_strict = true
filterwarnings = [
    "error",
    # Tests never run collectstatic.
    "ignore:No directory at:UserWarning",
    # django-simple-history 3.13 calls select_related() with no arguments for
    # models without foreign keys.
    "ignore:Calling select_related\\(\\) with no arguments:django.utils.deprecation.RemovedInDjango2028Warning",
]

[tool.coverage.run]
branch = true
source = ["apps", "config"]
omit = ["**/migrations/*", "**/tests/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.14"
strict = true
warn_unreachable = true
plugins = ["mypy_django_plugin.main"]
files = ["."]
exclude = ["/migrations/"]

[[tool.mypy.overrides]]
module = ["environ", "simple_history.*", "axes.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = [
    "apps.users.admin",
    "apps.classification.admin",
    "apps.accounts.admin",
    "apps.transactions.admin",
]
# SimpleHistoryAdmin is untyped.
disallow_subclassing_any = false

[tool.django-stubs]
django_settings_module = "config.settings"
