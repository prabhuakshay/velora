# Publishes the prod image to GHCR for every version tag that passes CI.
# Releases must be semver tags on main: anything else fails the guard.
name: Release image

on:
  push:
    tags: ["v*"]

jobs:
  # Runs before ci so a bad tag fails in seconds, not after a full CI run.
  guard:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      # metadata-action emits no tags for a non-semver ref, which fails the push
      # with a cryptic buildx error. The regex is the one from semver.org.
      - env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          semver='^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-((0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*)(\.(0|[1-9][0-9]*|[0-9]*[a-zA-Z-][0-9a-zA-Z-]*))*))?(\+([0-9a-zA-Z-]+(\.[0-9a-zA-Z-]+)*))?$'
          if [[ ! "${REF_NAME#v}" =~ $semver ]]; then
            echo "::error::Tag $REF_NAME is not a valid version. Expected vX.Y.Z or vX.Y.Z-pre."
            exit 1
          fi

      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $REF_NAME is on a commit that is not on main. Releases must be tagged on main."
            exit 1
          fi

  ci:
    needs: guard
    uses: ./.github/workflows/ci.yml

  publish:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # Full history so every tag is available to the latest check.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # latest goes only to the highest stable tag, so a hotfix on an older line
      # can't roll back hosts that track it.
      - id: latest
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          highest=$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n 1 || true)
          echo "enable=$([ "$REF_NAME" = "$highest" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      # v1.2.3 → 1.2.3, 1.2 and, if it is the highest stable tag, latest.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ steps.latest.outputs.enable }}

      # QEMU runs the arm64 Python stages; the venv holds native wheels.
      - uses: docker/setup-qemu-action@v4

      # Buildx is required for the GHA layer cache and multi-platform builds.
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          target: prod
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
