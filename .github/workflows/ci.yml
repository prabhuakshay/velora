# Runs the same checks as the local git hooks, on GitHub, so nothing reaches
# main that skipped them locally (e.g. a commit made with --no-verify).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The release workflow calls this so a tag only publishes if the checks pass.
  workflow_call:

jobs:
  check:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: velora
          POSTGRES_PASSWORD: velora
          POSTGRES_DB: velora
        ports: ["5432:5432"]
        # Steps start only once Postgres reports healthy, so tests don't race its startup.
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # CI-only values; settings refuse to load without them.
    env:
      SECRET_KEY: ci-only-not-secret
      DATABASE_URL: postgres://velora:velora@localhost:5432/velora

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml instead of silently updating it.
      - run: uv sync --locked

      - name: Lint, format, type-check
        run: uv run prek run --all-files --show-diff-on-failure

      # pytest is a pre-push hook, which prek run skips. --cov comes from pyproject.toml addopts.
      - name: Tests with coverage
        run: uv run pytest

  # A broken Dockerfile (e.g. a template directory missing from the Tailwind
  # stage) would otherwise only surface at deploy.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build --target prod .
