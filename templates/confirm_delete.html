{% extends "app_base.html" %}

{% block title %}Delete {{ noun }} · Velora{% endblock %}

{% block card %}
  <h1 class="text-xl font-semibold">Delete {{ noun }}</h1>
  <p class="mt-4 text-slate-700">Delete <strong>{{ object }}</strong>? This cannot be undone.</p>
  <form method="post" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="w-full rounded-lg bg-red-600 px-4 py-2.5 font-medium text-white hover:bg-red-700">Delete</button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a href="{{ list_url }}" class="link">Cancel</a>
  </p>
{% endblock %}
