{% extends "auth_base.html" %}

{% block title %}Delete expense account · Velora{% endblock %}

{% block card %}
  <h1 class="text-xl font-semibold">Delete expense account</h1>
  <p class="mt-4 text-slate-700">Delete <strong>{{ expense_account.name }}</strong>? This cannot be undone.</p>
  <form method="post" class="mt-6">
    {% csrf_token %}
    <button type="submit" class="w-full rounded-lg bg-red-600 px-4 py-2.5 font-medium text-white hover:bg-red-700">Delete</button>
  </form>
  <p class="mt-4 text-center text-sm">
    <a href="{% url 'expense_account_list' %}" class="link">Cancel</a>
  </p>
{% endblock %}
