{% for entry in entries %}
  <li class="flex items-center gap-2 py-2">
    {% if entry.kind == "category" %}
      <span role="img" aria-label="Category" class="shrink-0 text-slate-500">{% icon "tag" "size-4" %}</span>
    {% else %}
      <span role="img" aria-label="Expense Account" class="shrink-0 text-slate-500">{% icon "store" "size-4" %}</span>
    {% endif %}
    <span>{{ entry.text }} <span class="text-slate-500">· {{ entry.when|timesince }} ago</span></span>
  </li>
{% empty %}
  <li class="py-2 text-slate-500">No activity yet.</li>
{% endfor %}
{% if next_offset %}
  <li class="py-2">
    <button type="button" hx-get="{% url 'activity' %}?offset={{ next_offset }}" hx-target="closest li" hx-swap="outerHTML" class="link">Show more</button>
  </li>
{% endif %}
