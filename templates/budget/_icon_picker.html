<fieldset>
  <legend class="block text-sm font-medium text-slate-700">{{ field.label }}</legend>
  <div class="mt-1 flex flex-wrap gap-2">
    {% include "budget/_icon_options.html" with icons=form.icon_picker.icons selected=form.icon_picker.selected %}
  </div>
  <label for="icon-search" class="mt-3 block text-sm font-medium text-slate-700">Search all icons</label>
  <input id="icon-search" type="search" name="q" autocomplete="off" placeholder="e.g. money, car, pizza"
         hx-get="{% url 'icon_search' %}" hx-trigger="input changed delay:200ms, search"
         hx-target="#icon-results" hx-include="[name='icon']:checked"
         class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-base focus:border-slate-900 focus:outline-none">
  <div id="icon-results" class="mt-2 flex flex-wrap gap-2"></div>
  {% for error in field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
  {% endfor %}
</fieldset>
