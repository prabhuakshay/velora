<fieldset>
  <legend class="block text-sm font-medium text-slate-700">{{ field.label }}</legend>
  <div class="mt-1 flex flex-wrap gap-3">
    {% for name, swatch, checked in form.color_swatches %}
      <label class="cursor-pointer">
        <input type="radio" name="color" value="{{ name }}"{% if checked %} checked{% endif %} class="peer sr-only">
        <span title="{{ name }}" class="block size-9 rounded-full {{ swatch }} ring-offset-2 peer-checked:ring-2 peer-checked:ring-slate-900 peer-focus-visible:ring-2 peer-focus-visible:ring-slate-400"></span>
      </label>
    {% endfor %}
  </div>
  {% for error in field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
  {% endfor %}
</fieldset>
