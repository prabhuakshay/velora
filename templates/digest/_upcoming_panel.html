<section class="rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200" aria-labelledby="upcoming-heading">
  <h2 id="upcoming-heading" class="text-lg font-semibold">Upcoming</h2>
  {% for section in sections %}
    <h3 class="mt-3 text-sm font-medium text-slate-600">{{ section.title }}</h3>
    <ul class="mt-1 divide-y divide-slate-100">
      {% for item in section.items %}
        <li class="flex items-center justify-between gap-3 py-2 text-sm">
          <a href="{{ item.url }}" class="min-w-0 truncate hover:underline">
            <span class="text-slate-500">{{ item.when|date:"j M Y" }}</span> {{ item.label }}
          </a>
          <span class="shrink-0 tabular-nums">{% if item.amount is None %}₹?{% else %}{% amount item.amount %}{% endif %}</span>
        </li>
      {% endfor %}
    </ul>
  {% empty %}
    <p class="mt-2 text-sm text-slate-600">Nothing needs you today.</p>
  {% endfor %}
</section>
