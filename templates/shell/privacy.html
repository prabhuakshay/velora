{% if user.privacy_mode %}
  <a href="{% url 'privacy_mode_off' %}?next={{ request.get_full_path|urlencode }}" class="{{ class }}" aria-label="Privacy Mode is on. Turn it off" title="Privacy Mode is on. Turn it off">
    <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 5.1A10.4 10.4 0 0 1 12 5c6.5 0 10 7 10 7a17 17 0 0 1-3.2 4.2M6.6 6.6A17 17 0 0 0 2 12s3.5 7 10 7a9.7 9.7 0 0 0 5.4-1.6"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>
  </a>
{% else %}
  <form method="post" action="{% url 'privacy_mode_on' %}">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ request.get_full_path }}">
    <button type="submit" class="{{ class }}" aria-label="Turn on Privacy Mode" title="Turn on Privacy Mode">
      <svg viewBox="0 0 24 24" class="size-5 fill-none stroke-current stroke-2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
    </button>
  </form>
{% endif %}
