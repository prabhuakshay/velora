{% extends "base.html" %}

{% block content %}
  {% url 'index' as home_url %}
  {% url 'password_change' as password_change_url %}
  <div class="md:flex md:min-h-screen">
    <aside class="border-b border-slate-200 bg-white p-4 text-sm md:w-56 md:shrink-0 md:border-r md:border-b-0">
      <a href="{{ home_url }}" class="text-lg font-bold tracking-tight">Velora</a>
      <nav class="mt-4 flex flex-wrap gap-1 md:flex-col">
        <a href="{{ home_url }}" class="nav-link{% if request.path == home_url %} nav-link-active{% endif %}">Home</a>
        <a href="{{ password_change_url }}" class="nav-link{% if password_change_url in request.path %} nav-link-active{% endif %}">Change password</a>
        <form method="post" action="{% url 'logout' %}">
          {% csrf_token %}
          <button type="submit" class="nav-link w-full text-left">Log out</button>
        </form>
      </nav>
      <p class="mt-4 truncate text-xs text-slate-500">{{ user.email }}</p>
    </aside>
    <main class="min-w-0 flex-1 px-4 py-6 md:px-8">
      <div class="max-w-2xl">
        {% block main %}
          <div class="max-w-md rounded-2xl bg-white p-6 shadow-sm ring-1 ring-slate-200">
            {% block card %}{% endblock %}
          </div>
        {% endblock %}
      </div>
    </main>
  </div>
{% endblock %}
