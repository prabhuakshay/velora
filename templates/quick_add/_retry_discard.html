<div class="mt-2 flex gap-1 text-sm">
  <form method="post" action="{% url 'quick_add_retry' quick_add.pk %}">
    {% csrf_token %}
    <button type="submit" class="rounded-lg px-2 py-1 font-medium text-slate-700 hover:bg-slate-100">{% if quick_add.is_stalled %}Retry{% else %}Retry as is{% endif %}</button>
  </form>
  <form method="post" action="{% url 'quick_add_discard' quick_add.pk %}">
    {% csrf_token %}
    <button type="submit" class="rounded-lg px-2 py-1 text-slate-500 hover:bg-red-50 hover:text-red-700">Discard</button>
  </form>
</div>
