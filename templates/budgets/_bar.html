{% if not user.privacy_mode %}
  <div class="{% if thick %}h-2.5{% else %}h-1.5{% endif %}">
    <svg viewBox="0 0 100 4" preserveAspectRatio="none" class="block size-full overflow-hidden rounded-full" aria-hidden="true">
      <rect width="100" height="4" class="fill-slate-100"/>
      <rect width="{{ spent|stringformat:'.2f' }}" height="4" class="{% if state == 'over' %}fill-red-500{% elif state == 'close' %}fill-amber-500{% else %}fill-slate-800{% endif %}"/>
      {% if expected %}<rect x="{{ spent|stringformat:'.2f' }}" width="{{ expected|stringformat:'.2f' }}" height="4" class="{% if state == 'close' %}fill-amber-200{% else %}fill-slate-300{% endif %}"/>{% endif %}
    </svg>
  </div>
{% endif %}
