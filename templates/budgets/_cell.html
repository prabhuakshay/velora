{% if editable %}
  <label class="group/cell flex w-32 shrink-0 cursor-text items-center rounded-lg bg-slate-100 ring-slate-900 transition-colors hover:bg-slate-200/70 has-[input:focus]:bg-white has-[input:focus]:ring-2 sm:w-36">
    <span class="pl-3 text-sm text-slate-400 before:content-['₹'] group-has-[input:placeholder-shown]/cell:hidden" aria-hidden="true"></span>
    <input type="text" inputmode="decimal" enterkeyhint="next" autocomplete="off" name="amount" value="{% if value is not None %}{{ value|floatformat:"-2u" }}{% endif %}" placeholder="{{ placeholder|default:'Add' }}" aria-label="{{ label }}" aria-describedby="{{ fid }}-error" data-budget-cell hx-post="{{ edit_url }}?month={{ picture.month|date:'Y-m' }}" hx-trigger="change" hx-swap="none" class="w-full min-w-0 bg-transparent py-2 pr-3 pl-1 text-right text-base font-semibold tabular-nums placeholder:font-medium placeholder:text-slate-500 focus:outline-hidden sm:py-1.5 [&.htmx-request]:text-slate-400">
  </label>
{% else %}
  <p class="shrink-0 text-right font-semibold tabular-nums"><span class="mr-1 text-xs font-normal text-slate-500">Budget</span> {% if value is not None %}{% amount value %}{% else %}<span class="text-slate-400">–</span>{% endif %}</p>
{% endif %}
