{% comment %}Bottom sheet on phones, centred modal on desktop. Opens over the Transaction sheet too.{% endcomment %}
<dialog id="delete-transaction-{{ transaction.pk }}" data-dialog data-sheet aria-labelledby="delete-transaction-{{ transaction.pk }}-title" class="m-0 mt-auto w-full max-w-none overflow-hidden rounded-t-3xl bg-white p-0 text-base text-slate-900 shadow-2xl backdrop:bg-chrome/60 backdrop:backdrop-blur-sm md:m-auto md:max-w-sm md:rounded-3xl">
  <div class="px-5 pt-2 pb-[max(1.25rem,env(safe-area-inset-bottom))] md:px-6 md:pt-6 md:pb-6">
    <div class="mx-auto mb-4 h-1 w-9 rounded-full bg-slate-300 md:hidden" aria-hidden="true"></div>
    {% include "transactions/_delete_confirm.html" with in_dialog=True %}
  </div>
</dialog>
