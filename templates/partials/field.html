<div>
  <label for="{{ field.id_for_label }}" class="block text-sm font-medium text-slate-700">{{ field.label }}</label>
  <div class="field-control mt-1">
    {{ field }}
  </div>
  {% if field.help_text %}
    <div id="{{ field.auto_id }}_helptext" class="mt-1 text-xs text-slate-500 [&_ul]:list-disc [&_ul]:pl-4">{{ field.help_text }}</div>
  {% endif %}
  {% for error in field.errors %}
    <p class="mt-1 text-sm text-red-600">{{ error }}</p>
  {% endfor %}
</div>
