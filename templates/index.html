{% extends "base.html" %}

{% block content %}
  <main class="mx-auto flex min-h-screen max-w-md flex-col justify-center px-4 py-12 text-center">
    <h1 class="text-4xl font-bold tracking-tight">Velora</h1>
    <p class="mt-3 text-slate-600">Personal finance, kept simple.</p>
    <p class="mt-8 text-sm text-slate-500">Signed in as {{ user.email }}</p>
    <div class="mt-4 flex flex-wrap justify-center gap-3">
      <a href="{% url 'category_list' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">Categories</a>
      <a href="{% url 'expense_account_list' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">Expense accounts</a>
      <a href="{% url 'password_change' %}" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">Change password</a>
      <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit" class="rounded-lg border border-slate-300 px-4 py-2 text-sm font-medium hover:bg-slate-100">Log out</button>
      </form>
    </div>
  </main>
{% endblock %}
