{% if subscriptions_count %}
<a href="{% url 'subscription_list' %}" class="flex items-center gap-3 rounded-2xl bg-white p-4 shadow-sm ring-1 ring-slate-200 hover:bg-slate-50 md:px-5">
  <span class="flex size-9 shrink-0 items-center justify-center rounded-full bg-gold-100 text-gold-700" aria-hidden="true">{% include "shell/icon.html" with name="repeat" class="size-4" %}</span>
  <span class="min-w-0 flex-1">
    <span class="block font-semibold">Subscriptions</span>
    <span class="block truncate text-xs text-slate-500">{{ subscriptions_count }} active</span>
  </span>
  <span class="shrink-0 text-right">
    <span class="block font-semibold tabular-nums">{% amount subscriptions_monthly %}</span>
    <span class="block text-xs text-slate-500">a month</span>
  </span>
</a>
{% endif %}
