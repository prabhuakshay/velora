<a href="{{ url }}" class="flex items-center justify-between gap-3 px-4 py-3 text-sm hover:bg-slate-50 md:px-5">
  <span class="min-w-0">
    <span class="flex min-w-0 items-center gap-2">
      <span class="truncate font-medium">{{ name }}</span>
      {% include "budgets/_state_badge.html" with state=row.state %}
    </span>
    <span class="mt-0.5 block truncate text-xs text-slate-500 tabular-nums">Spent {% amount row.spent %} of {% amount row.budget %}</span>
  </span>
  <span class="shrink-0 font-semibold tabular-nums {% amount_color row.left %}">{% amount row.left %} left</span>
</a>
