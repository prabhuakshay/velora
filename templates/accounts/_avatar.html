{% comment %}The Account's initial, tinted by kind; a card icon for a credit card.{% endcomment %}
<span class="flex {{ size|default:'size-10' }} shrink-0 items-center justify-center rounded-full text-sm font-semibold uppercase {% if account.kind == 'asset' %}bg-sky-50 text-sky-700 ring-1 ring-sky-100{% elif account.kind == 'liability' %}bg-amber-50 text-amber-700 ring-1 ring-amber-100{% elif account.kind == 'income' %}bg-emerald-50 text-emerald-700 ring-1 ring-emerald-100{% else %}bg-slate-100 text-slate-600 ring-1 ring-slate-200{% endif %}" aria-hidden="true">
  {% if account.is_card %}{% include "shell/icon.html" with name="card" class="size-4" %}{% else %}{{ account.name|slice:":1" }}{% endif %}
</span>
