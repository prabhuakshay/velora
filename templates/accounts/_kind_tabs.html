<nav class="-mx-4 overflow-x-auto px-4 [scrollbar-width:none] md:mx-0 md:px-0 [&::-webkit-scrollbar]:hidden" aria-label="Account kinds">
  <div class="inline-flex gap-1 rounded-xl bg-slate-200/60 p-1">
    {% for tab in tabs %}
      <a href="{{ tab.url }}" {% if tab.active %}aria-current="page"{% endif %} class="flex shrink-0 items-center gap-1.5 rounded-lg px-3 py-1.5 text-sm font-medium transition-colors {% if tab.active %}bg-white text-slate-900 shadow-sm{% else %}text-slate-600 hover:text-slate-900 active:bg-slate-200{% endif %}">
        {{ tab.title }} <span class="text-xs tabular-nums {% if tab.active %}text-slate-500{% else %}text-slate-400{% endif %}">{{ tab.count }}</span>
      </a>
    {% endfor %}
  </div>
</nav>
