# Dev stack: `docker compose up`, then http://localhost:8000.
#
# No database service: DATABASE_URL in .env is used as-is. A server on this
# machine is host.docker.internal from inside the container, not localhost.

name: velora

x-dev-user: &dev-user
  # Files written into the bind mount (migrations, compiled CSS) stay yours,
  # not root's.
  user: "${DOCKER_UID:-1000}:${DOCKER_GID:-1000}"

services:
  django:
    <<: *dev-user
    build:
      context: .
      target: dev
      args:
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    # settings.py reads /app/.env from the bind mount; these only override it.
    environment:
      DEBUG: ${DEBUG:-true}
      ALLOWED_HOSTS: localhost,127.0.0.1${ALLOWED_HOSTS:+,$ALLOWED_HOSTS}
    volumes:
      - .:/app
      # Host-platform artifacts that must not leak into the container.
      - /app/.venv
      - /app/node_modules
      - /app/staticfiles
      - uv-cache:/cache/uv
    ports:
      - "${DOCKER_HOST_PORT:-8000}:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # `docker compose attach django` for breakpoint().
    stdin_open: true
    tty: true
    # Catches runserver's reloader staying up while the app fails to import.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz/', timeout=4)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
    depends_on:
      # On a fresh clone the CSS and JS don't exist until the watcher's first
      # build; starting earlier serves unstyled pages with no error.
      tailwind:
        condition: service_healthy

  tailwind:
    <<: *dev-user
    build:
      context: .
      target: tailwind
      args:
        DOCKER_UID: ${DOCKER_UID:-1000}
        DOCKER_GID: ${DOCKER_GID:-1000}
    # Without a TTY the CLI sees stdin close and stops watching.
    tty: true
    volumes:
      - .:/app
      - /app/node_modules
      - npm-cache:/cache/npm
    healthcheck:
      test: ["CMD-SHELL", "test -s static/css/app.css && test -s static/js/htmx.min.js && test -s static/js/alpine.min.js && test -s static/icons/tag.svg && test -s static/icons/tags.json"]
      interval: 30s
      timeout: 3s
      retries: 5
      start_period: 120s
      start_interval: 2s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M

volumes:
  uv-cache:
  npm-cache:
